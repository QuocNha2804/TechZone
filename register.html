<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body
    class="d-flex align-items-center"
    style="
      min-height: 100vh;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    "
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card border-0 shadow-lg">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <h2 class="fw-bold text-warning">
                  <i class="bi bi-cpu"></i> TechZone
                </h2>
                <p class="text-muted">Tạo tài khoản mới</p>
              </div>
              <form onsubmit="doRegister(event)">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Họ tên</label
                  ><input
                    type="text"
                    id="regName"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email</label
                  ><input
                    type="email"
                    id="regEmail"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Số điện thoại</label
                  ><input
                    type="tel"
                    id="regPhone"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Mật khẩu</label
                  ><input
                    type="password"
                    id="regPass"
                    class="form-control"
                    required
                    minlength="6"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Xác nhận mật khẩu</label
                  ><input
                    type="password"
                    id="regPass2"
                    class="form-control"
                    required
                  />
                </div>
                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="regTerms"
                    required
                  /><label class="form-check-label small" for="regTerms"
                    >Tôi đồng ý điều khoản dịch vụ</label
                  >
                </div>
                <button class="btn btn-warning w-100 fw-bold">Đăng ký</button>
              </form>
              <p class="text-center mt-3 mb-0 small">
                Đã có tài khoản?
                <a href="login.html" class="text-warning fw-bold">Đăng nhập</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
      function doRegister(e) {
        e.preventDefault();
        const pass = document.getElementById("regPass").value;
        const pass2 = document.getElementById("regPass2").value;
        const phone = document.getElementById("regPhone").value.trim();
        if (pass !== pass2) return showToast("Mật khẩu không khớp", "error");
        if (!/^0\d{9}$/.test(phone))
          return showToast("SĐT không hợp lệ", "error");
        const r = registerUser(
          document.getElementById("regName").value.trim(),
          document.getElementById("regEmail").value.trim(),
          phone,
          pass,
        );
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) setTimeout(() => (location.href = "index.html"), 800);
      }
    </script>
  </body>
</html>
