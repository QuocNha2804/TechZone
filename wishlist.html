<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yêu thích | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="cart.html" class="badge-icon"
            ><i class="bi bi-cart3"></i
            ><span class="badge cart-badge">0</span></a
          >
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>
    <div class="container my-5">
      <h2 class="fw-bold mb-4">
        <i class="bi bi-heart-fill text-danger"></i> Sản phẩm yêu thích
      </h2>
      <div class="row g-3" id="wishGrid"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/main.js"></script>
    <script>
      function renderWish() {
        const ids = getWishlist();
        const el = document.getElementById("wishGrid");
        if (!ids.length) {
          el.innerHTML =
            '<div class="col-12 text-center py-5"><i class="bi bi-heart display-1 text-muted"></i><p class="mt-3">Chưa có sản phẩm yêu thích</p><a href="products.html" class="btn btn-warning fw-bold">Mua sắm ngay</a></div>';
          return;
        }
        el.innerHTML = ids
          .map((id) => {
            const p = getProductById(id);
            if (!p) return "";
            return `<div class="col-6 col-md-4 col-lg-3"><div class="product-card h-100">
      <div class="product-thumb"><img src="${p.images[0]}" loading="lazy"></div>
      <div class="p-3"><h6 class="product-name">${p.name}</h6>
      <div class="price mb-2">${formatPrice(p.price)}</div>
      <div class="d-flex gap-2">
        <button class="btn btn-warning btn-sm flex-grow-1" onclick="addToCart(${p.id})"><i class="bi bi-cart-plus"></i> Giỏ</button>
        <button class="btn btn-outline-danger btn-sm" onclick="toggleWishlist(${p.id});renderWish()"><i class="bi bi-trash"></i></button>
      </div></div></div></div>`;
          })
          .join("");
      }
      document.addEventListener("DOMContentLoaded", renderWish);
    </script>
  </body>
</html>
