<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thanh toán | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="fw-bold mb-4"><i class="bi bi-credit-card"></i> Thanh toán</h2>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h5 class="fw-bold mb-3">Thông tin giao hàng</h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <input
                    id="ckName"
                    class="form-control"
                    placeholder="Họ tên *"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <input
                    id="ckPhone"
                    class="form-control"
                    placeholder="Số điện thoại *"
                    required
                  />
                </div>
                <div class="col-12">
                  <input
                    id="ckEmail"
                    type="email"
                    class="form-control"
                    placeholder="Email *"
                    required
                  />
                </div>
                <div class="col-12">
                  <input
                    id="ckAddress"
                    class="form-control"
                    placeholder="Địa chỉ *"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <select id="ckCity" class="form-select">
                    <option>TP. Hồ Chí Minh</option>
                    <option>Hà Nội</option>
                    <option>Đà Nẵng</option>
                    <option>Cần Thơ</option>
                    <option>Khác</option>
                  </select>
                </div>
                <div class="col-12">
                  <textarea
                    id="ckNote"
                    class="form-control"
                    rows="2"
                    placeholder="Ghi chú"
                  ></textarea>
                </div>
              </div>
              <h5 class="fw-bold mt-4 mb-3">Phương thức thanh toán</h5>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="pay"
                  value="COD"
                  checked
                  id="pay1"
                /><label class="form-check-label" for="pay1"
                  >💵 Thanh toán khi nhận hàng (COD)</label
                >
              </div>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="pay"
                  value="BANK"
                  id="pay2"
                /><label class="form-check-label" for="pay2"
                  >🏦 Chuyển khoản ngân hàng</label
                >
              </div>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="pay"
                  value="WALLET"
                  id="pay3"
                /><label class="form-check-label" for="pay3"
                  >📱 Ví điện tử (MoMo/ZaloPay)</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h5 class="fw-bold mb-3">Đơn hàng của bạn</h5>
              <div id="ckItems"></div>
              <hr />
              <div id="ckTotal"></div>
              <button
                class="btn btn-warning btn-lg w-100 fw-bold mt-3"
                onclick="placeOrder()"
              >
                Đặt hàng ngay
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center p-5">
            <i class="bi bi-check-circle-fill text-success display-1"></i>
            <h3 class="fw-bold mt-3">Đặt hàng thành công!</h3>
            <p class="text-muted">
              Mã đơn hàng: <strong id="orderCode"></strong>
            </p>
            <p class="small">Chúng tôi sẽ liên hệ xác nhận trong 5 phút.</p>
            <a href="index.html" class="btn btn-warning fw-bold"
              >Về trang chủ</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
      function renderSummary() {
        const cart = getCart();
        const subtotal = getCartTotal();
        const coupon = localStorage.getItem("techzone-coupon");
        let discount = 0;
        if (coupon && COUPONS[coupon]?.type === "percent")
          discount = (subtotal * COUPONS[coupon].value) / 100;
        const ship = coupon === "FREESHIP" || subtotal >= 500000 ? 0 : 30000;
        const total = subtotal - discount + ship;
        document.getElementById("ckItems").innerHTML = cart
          .map(
            (i) => `
    <div class="d-flex justify-content-between small mb-2">
      <span>${i.name} <span class="text-muted">x${i.qty}</span></span>
      <strong>${formatPrice(i.price * i.qty)}</strong>
    </div>`,
          )
          .join("");
        document.getElementById("ckTotal").innerHTML = `
    <div class="d-flex justify-content-between small"><span>Tạm tính</span><span>${formatPrice(subtotal)}</span></div>
    <div class="d-flex justify-content-between small"><span>Giảm</span><span class="text-success">-${formatPrice(discount)}</span></div>
    <div class="d-flex justify-content-between small"><span>Ship</span><span>${ship ? formatPrice(ship) : "Miễn phí"}</span></div>
    <div class="d-flex justify-content-between mt-2"><strong>Tổng</strong><strong class="text-danger">${formatPrice(total)}</strong></div>`;
      }

      function placeOrder() {
        const name = document.getElementById("ckName").value.trim();
        const phone = document.getElementById("ckPhone").value.trim();
        const email = document.getElementById("ckEmail").value.trim();
        const address = document.getElementById("ckAddress").value.trim();
        if (!name || !phone || !email || !address)
          return showToast("Vui lòng nhập đầy đủ thông tin", "warning");
        if (!/^0\d{9}$/.test(phone))
          return showToast("SĐT không hợp lệ (10 số, bắt đầu 0)", "error");
        if (!/^\S+@\S+\.\S+$/.test(email))
          return showToast("Email không hợp lệ", "error");
        if (!getCart().length) return showToast("Giỏ hàng trống", "warning");

        const code = "TZ" + Date.now().toString().slice(-8);
        const order = {
          code,
          name,
          phone,
          email,
          address,
          city: document.getElementById("ckCity").value,
          note: document.getElementById("ckNote").value,
          payment: document.querySelector('input[name="pay"]:checked').value,
          items: getCart(),
          total: getCartTotal(),
          createdAt: new Date().toISOString(),
        };
        const orders = JSON.parse(
          localStorage.getItem("techzone-orders") || "[]",
        );
        orders.unshift(order);
        localStorage.setItem("techzone-orders", JSON.stringify(orders));
        saveCart([]);
        localStorage.removeItem("techzone-coupon");
        document.getElementById("orderCode").textContent = code;
        new bootstrap.Modal(document.getElementById("successModal")).show();
      }

      document.addEventListener("DOMContentLoaded", renderSummary);
    </script>
  </body>
</html>
