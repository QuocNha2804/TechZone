<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body
    class="d-flex align-items-center"
    style="
      min-height: 100vh;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    "
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-lg">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <h2 class="fw-bold text-warning">
                  <i class="bi bi-cpu"></i> TechZone
                </h2>
                <p class="text-muted">Đăng nhập tài khoản</p>
              </div>
              <form onsubmit="doLogin(event)">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email</label
                  ><input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Mật khẩu</label
                  ><input
                    type="password"
                    id="loginPass"
                    class="form-control"
                    required
                  />
                </div>
                <button class="btn btn-warning w-100 fw-bold">Đăng nhập</button>
              </form>
              <p class="text-center mt-3 mb-0 small">
                Chưa có tài khoản?
                <a href="register.html" class="text-warning fw-bold"
                  >Đăng ký ngay</a
                >
              </p>
              <p class="text-center small mb-0">
                <a href="index.html">← Về trang chủ</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
      function doLogin(e) {
        e.preventDefault();
        const r = loginUser(
          document.getElementById("loginEmail").value,
          document.getElementById("loginPass").value,
        );
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) setTimeout(() => (location.href = "index.html"), 800);
      }
    </script>
  </body>
</html>
