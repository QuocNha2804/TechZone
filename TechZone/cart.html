<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giỏ hàng | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body>
    <div class="top-bar"><div class="container">Hotline: 1900 1234</div></div>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="wishlist.html" class="badge-icon"
            ><i class="bi bi-heart"></i
            ><span class="badge wishlist-badge">0</span></a
          >
          <a href="cart.html" class="badge-icon"
            ><i class="bi bi-cart3"></i
            ><span class="badge cart-badge">0</span></a
          >
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="fw-bold mb-4"><i class="bi bi-cart3"></i> Giỏ hàng</h2>
      <div id="cartContainer"></div>
    </div>

    <footer>
      <div class="container text-center small py-4">&copy; 2024 TechZone</div>
    </footer>
    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/main.js"></script>
    <script>
      function renderCart() {
        const cart = getCart();
        const container = document.getElementById("cartContainer");
        if (!cart.length) {
          container.innerHTML = `
      <div class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <h4 class="mt-3">Giỏ hàng trống</h4>
        <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng nhé!</p>
        <a href="products.html" class="btn btn-warning fw-bold"><i class="bi bi-arrow-left"></i> Tiếp tục mua sắm</a>
      </div>`;
          return;
        }
        const subtotal = getCartTotal();
        const coupon = localStorage.getItem("techzone-coupon");
        let discount = 0;
        if (coupon && COUPONS[coupon]?.type === "percent")
          discount = (subtotal * COUPONS[coupon].value) / 100;
        const ship = coupon === "FREESHIP" || subtotal >= 500000 ? 0 : 30000;
        const total = subtotal - discount + ship;

        container.innerHTML = `
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            ${cart
              .map(
                (item) => `
              <div class="d-flex gap-3 border-bottom pb-3 mb-3 align-items-center">
                <img src="${item.image}" class="cart-img">
                <div class="flex-grow-1">
                  <h6 class="mb-1">${item.name}</h6>
                  <div class="text-muted small">${item.variant}</div>
                  <div class="text-danger fw-bold">${formatPrice(item.price)}</div>
                </div>
                <div class="d-flex flex-column align-items-end gap-2">
                  <div class="input-group input-group-sm" style="width:110px">
                    <button class="btn btn-outline-secondary" onclick="cartUpdate(${item.id},'${item.variant}',${item.qty - 1})">-</button>
                    <input type="text" class="form-control text-center" value="${item.qty}" readonly>
                    <button class="btn btn-outline-secondary" onclick="cartUpdate(${item.id},'${item.variant}',${item.qty + 1})">+</button>
                  </div>
                  <button class="btn btn-sm btn-link text-danger p-0" onclick="cartRemove(${item.id},'${item.variant}')"><i class="bi bi-trash"></i> Xóa</button>
                </div>
              </div>`,
              )
              .join("")}
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>
            <div class="d-flex justify-content-between mb-2"><span>Tạm tính</span><span>${formatPrice(subtotal)}</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Giảm giá</span><span class="text-success">-${formatPrice(discount)}</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Phí ship</span><span>${ship ? formatPrice(ship) : "Miễn phí"}</span></div>
            <hr>
            <div class="d-flex justify-content-between mb-3"><strong>Tổng cộng</strong><strong class="text-danger fs-5">${formatPrice(total)}</strong></div>
            <div class="input-group mb-3">
              <input type="text" id="couponInput" class="form-control" placeholder="Nhập mã giảm giá" value="${coupon || ""}">
              <button class="btn btn-outline-warning fw-bold" onclick="applyCouponAction()">Áp dụng</button>
            </div>
            <div class="small text-muted mb-3">Mã: TECH10, TECH20, FREESHIP</div>
            <a href="checkout.html" class="btn btn-warning w-100 fw-bold btn-lg">Đặt hàng →</a>
          </div>
        </div>
      </div>
    </div>`;
      }

      function cartUpdate(id, variant, qty) {
        updateQty(id, variant, qty);
        renderCart();
      }
      function cartRemove(id, variant) {
        removeFromCart(id, variant);
        renderCart();
        showToast("Đã xóa sản phẩm", "info");
      }
      function applyCouponAction() {
        const code = document.getElementById("couponInput").value.trim();
        const r = applyCoupon(code);
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) renderCart();
      }

      document.addEventListener("DOMContentLoaded", renderCart);
    </script>
  </body>
</html>
