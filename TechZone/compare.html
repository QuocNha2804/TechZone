<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>So sánh | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="cart.html" class="badge-icon"
            ><i class="bi bi-cart3"></i
            ><span class="badge cart-badge">0</span></a
          >
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>
    <div class="container my-5">
      <h2 class="fw-bold mb-4">
        <i class="bi bi-arrow-left-right"></i> So sánh sản phẩm
      </h2>
      <div id="compareContainer"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/main.js"></script>
    <script>
      function renderCompare() {
        const ids = getCompare();
        const el = document.getElementById("compareContainer");
        if (!ids.length) {
          el.innerHTML =
            '<div class="text-center py-5"><i class="bi bi-arrow-left-right display-1 text-muted"></i><p class="mt-3">Chưa có sản phẩm để so sánh</p><a href="products.html" class="btn btn-warning fw-bold">Chọn sản phẩm</a></div>';
          return;
        }
        const items = ids.map(getProductById).filter(Boolean);
        el.innerHTML = `
    <div class="table-responsive"><table class="table table-bordered align-middle bg-white">
      <thead><tr><th style="min-width:120px">Tiêu chí</th>
      ${items.map((p) => `<th class="text-center" style="min-width:200px"><img src="${p.images[0]}" width="100" class="rounded"><div class="fw-bold mt-2 small">${p.name}</div><button class="btn btn-sm btn-link text-danger" onclick="toggleCompare(${p.id});renderCompare()"><i class="bi bi-trash"></i></button></th>`).join("")}
      </tr></thead>
      <tbody>
        <tr><th>Giá</th>${items.map((p) => `<td class="text-center text-danger fw-bold">${formatPrice(p.price)}</td>`).join("")}</tr>
        <tr><th>Thương hiệu</th>${items.map((p) => `<td class="text-center">${getBrandName(p.brand)}</td>`).join("")}</tr>
        <tr><th>Màn hình</th>${items.map((p) => `<td class="text-center small">${p.specs.screen}</td>`).join("")}</tr>
        <tr><th>CPU</th>${items.map((p) => `<td class="text-center small">${p.specs.cpu}</td>`).join("")}</tr>
        <tr><th>RAM</th>${items.map((p) => `<td class="text-center">${p.specs.ram}</td>`).join("")}</tr>
        <tr><th>Bộ nhớ</th>${items.map((p) => `<td class="text-center">${p.specs.storage}</td>`).join("")}</tr>
        <tr><th>Camera</th>${items.map((p) => `<td class="text-center small">${p.specs.camera}</td>`).join("")}</tr>
        <tr><th>Pin</th>${items.map((p) => `<td class="text-center">${p.specs.battery}</td>`).join("")}</tr>
        <tr><th>HĐH</th>${items.map((p) => `<td class="text-center">${p.specs.os}</td>`).join("")}</tr>
        <tr><th>Đánh giá</th>${items.map((p) => `<td class="text-center text-warning">${"★".repeat(p.rating)}</td>`).join("")}</tr>
        <tr><th></th>${items.map((p) => `<td class="text-center"><button class="btn btn-warning btn-sm fw-bold" onclick="addToCart(${p.id})">Thêm giỏ</button></td>`).join("")}</tr>
      </tbody>
    </table></div>`;
      }
      document.addEventListener("DOMContentLoaded", renderCompare);
    </script>
  </body>
</html>
