<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/dark-mode.css" rel="stylesheet" />
  </head>
  <body>
    <div class="top-bar">
      <div class="container">Hotline: 1900 1234 - Freeship đơn 500K</div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav me-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Sản phẩm</a>
            </li>
          </ul>
          <div class="search-wrap me-3">
            <i class="bi bi-search"></i
            ><input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Tìm kiếm..."
            />
            <div id="searchSuggestions"></div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="wishlist.html" class="badge-icon"
              ><i class="bi bi-heart"></i
              ><span class="badge wishlist-badge">0</span></a
            >
            <a href="cart.html" class="badge-icon"
              ><i class="bi bi-cart3"></i
              ><span class="badge cart-badge">0</span></a
            >
            <button
              class="btn btn-sm btn-outline-secondary theme-toggle"
              onclick="toggleTheme()"
            >
              <i class="bi bi-moon-fill"></i>
            </button>
            <div id="auth-area"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container my-4" id="productDetail"></div>
    <footer>
      <div class="container text-center small py-4">&copy; 2024 TechZone</div>
    </footer>
    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product-detail.js"></script>
  </body>
