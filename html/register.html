<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body
    class="d-flex align-items-center"
    style="
      min-height: 100vh;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    "
  >
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-sm-5">
              <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none">
                  <h2 class="fw-bold text-warning mb-1">
                    <i class="bi bi-cpu"></i> TechZone
                  </h2>
                </a>
                <p class="text-muted small">Tạo tài khoản thành viên mới</p>
              </div>
              <form onsubmit="doRegister(event)">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Họ tên *</label>
                  <input
                    type="text"
                    id="regName"
                    class="form-control"
                    placeholder="Nguyễn Văn A"
                    required
                  />
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Email *</label>
                    <input
                      type="email"
                      id="regEmail"
                      class="form-control"
                      placeholder="name@example.com"
                      required
                    />
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Số điện thoại *</label>
                    <input
                      type="tel"
                      id="regPhone"
                      class="form-control"
                      placeholder="0912345678"
                      required
                    />
                  </div>
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Mật khẩu *</label>
                    <input
                      type="password"
                      id="regPass"
                      class="form-control"
                      placeholder="••••••••"
                      required
                      minlength="6"
                    />
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Xác nhận mật khẩu *</label>
                    <input
                      type="password"
                      id="regPass2"
                      class="form-control"
                      placeholder="••••••••"
                      required
                    />
                  </div>
                </div>
                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="regTerms"
                    required
                  />
                  <label class="form-check-label small" for="regTerms">
                    Tôi đồng ý với <a href="#" class="text-decoration-none">điều khoản dịch vụ</a>
                  </label>
                </div>
                <button class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                  Đăng ký tài khoản
                </button>
              </form>
              <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-muted mb-2">
                  Đã có tài khoản?
                  <a href="login.html" class="text-warning fw-bold text-decoration-none">Đăng nhập</a>
                </p>
                <p class="small mb-0">
                  <a href="../index.html" class="text-decoration-none text-muted">← Về trang chủ TechZone</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function doRegister(e) {
        e.preventDefault();
        const p1 = document.getElementById("regPass").value;
        const p2 = document.getElementById("regPass2").value;
        if (p1 !== p2) return showToast("Mật khẩu xác nhận không khớp!", "error");
        const phone = document.getElementById("regPhone").value.trim();
        if (!/^0\d{9}$/.test(phone))
          return showToast("Số điện thoại không hợp lệ (10 số, bắt đầu bằng 0)", "error");

        const r = registerUser(
          document.getElementById("regName").value.trim(),
          document.getElementById("regEmail").value.trim(),
          phone,
          p1,
        );
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) {
          setTimeout(() => {
            location.href = "../index.html";
          }, 800);
        }
      }
    </script>
  </body>
</html>
