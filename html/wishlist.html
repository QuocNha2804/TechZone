<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sản phẩm yêu thích | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="../index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="products.html" class="nav-link d-none d-md-inline-block">Sản phẩm</a>
          <a href="cart.html" class="badge-icon" title="Giỏ hàng">
            <i class="bi bi-cart3"></i><span class="badge cart-badge">0</span>
          </a>
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="../index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Yêu thích</li>
        </ol>
      </nav>
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold mb-0">
          <i class="bi bi-heart-fill text-danger"></i> Sản phẩm yêu thích
        </h2>
        <a href="products.html" class="btn btn-outline-warning btn-sm fw-bold">Khám phá thêm sản phẩm →</a>
      </div>
      <div class="row g-3" id="wishGrid"></div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="container text-center small py-4 text-muted">
        &copy; 2024 TechZone. All rights reserved.
      </div>
    </footer>

    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function renderWish() {
        const ids = getWishlist();
        const el = document.getElementById("wishGrid");
        if (!ids.length) {
          el.innerHTML = `
            <div class="col-12 text-center py-5 bg-card rounded-4 p-4 border">
              <i class="bi bi-heartbreak display-1 text-muted"></i>
              <h4 class="mt-3 fw-bold">Danh sách yêu thích trống</h4>
              <p class="text-muted">Lưu lại những sản phẩm bạn quan tâm để dễ dàng theo dõi giá và mua sau!</p>
              <a href="products.html" class="btn btn-warning fw-bold px-4 py-2 mt-2">Mua sắm ngay</a>
            </div>`;
          return;
        }
        el.innerHTML = ids
          .map((id) => {
            const p = getProductById(id);
            if (!p) return "";
            const safeName = (p.name || "").replace(/'/g, "\\'");
            return `
              <div class="col-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                  <div class="product-thumb">
                    ${p.discount ? `<span class="badge bg-danger position-absolute top-0 start-0 m-2">-${p.discount}%</span>` : ""}
                    <img src="${p.images[0]}" alt="${p.name}" loading="lazy" onerror="handleImgError(this, '${p.category}', '${safeName}')">
                    <div class="product-actions">
                      <button onclick="toggleCompare(${p.id})" title="So sánh"><i class="bi bi-arrow-left-right"></i></button>
                      <button onclick="openQuickView(${p.id})" title="Xem nhanh"><i class="bi bi-eye"></i></button>
                    </div>
                  </div>
                  <div class="p-3 d-flex flex-column justify-content-between flex-grow-1">
                    <div>
                      <div class="text-muted small">${getBrandName(p.brand)}</div>
                      <a href="product-detail.html?id=${p.id}" class="text-decoration-none">
                        <h6 class="product-name">${p.name}</h6>
                      </a>
                      <div class="price mb-2">${formatPrice(p.price)}</div>
                    </div>
                    <div class="d-flex gap-2">
                      <button class="btn btn-warning btn-sm flex-grow-1 fw-bold" onclick="addToCart(${p.id})">
                        <i class="bi bi-cart-plus"></i> Thêm giỏ
                      </button>
                      <button class="btn btn-outline-danger btn-sm" onclick="toggleWishlist(${p.id});renderWish()" title="Xóa">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>`;
          })
          .join("");
      }
      document.addEventListener("DOMContentLoaded", renderWish);
    </script>
  </body>
</html>
