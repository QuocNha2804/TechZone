<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body
    class="d-flex align-items-center"
    style="
      min-height: 100vh;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    "
  >
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-sm-5">
              <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none">
                  <h2 class="fw-bold text-warning mb-1">
                    <i class="bi bi-cpu"></i> TechZone
                  </h2>
                </a>
                <p class="text-muted small">Đăng nhập tài khoản thành viên</p>
              </div>
              <form onsubmit="doLogin(event)">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Email</label>
                  <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="email@example.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label small fw-semibold mb-0">Mật khẩu</label>
                    <a href="#" class="small text-muted text-decoration-none" onclick="showToast('Tính năng quên mật khẩu đang nâng cấp', 'info')">Quên?</a>
                  </div>
                  <input
                    type="password"
                    id="loginPass"
                    class="form-control mt-1"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <button class="btn btn-warning w-100 fw-bold py-2 shadow-sm">
                  Đăng nhập
                </button>
              </form>
              <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-muted mb-2">
                  Chưa có tài khoản?
                  <a href="register.html" class="text-warning fw-bold text-decoration-none">Đăng ký ngay</a>
                </p>
                <p class="small mb-0">
                  <a href="../index.html" class="text-decoration-none text-muted">← Về trang chủ TechZone</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function doLogin(e) {
        e.preventDefault();
        const r = loginUser(
          document.getElementById("loginEmail").value,
          document.getElementById("loginPass").value,
        );
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) {
          setTimeout(() => {
            location.href = "../index.html";
          }, 800);
        }
      }
    </script>
  </body>
</html>
