<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giỏ hàng | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body>
    <div class="top-bar"><div class="container">Hotline: 1900 1234 - Freeship đơn từ 500K</div></div>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="../index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="products.html" class="nav-link d-none d-md-inline-block">Sản phẩm</a>
          <a href="wishlist.html" class="badge-icon" title="Yêu thích">
            <i class="bi bi-heart"></i><span class="badge wishlist-badge">0</span>
          </a>
          <a href="cart.html" class="badge-icon active" title="Giỏ hàng">
            <i class="bi bi-cart3"></i><span class="badge cart-badge">0</span>
          </a>
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="../index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Giỏ hàng</li>
        </ol>
      </nav>
      <h2 class="fw-bold mb-4"><i class="bi bi-cart3 text-warning"></i> Giỏ hàng của bạn</h2>
      <div id="cartContainer"></div>
    </div>

    <footer>
      <div class="container text-center small py-4 text-muted">&copy; 2024 TechZone. All rights reserved.</div>
    </footer>
    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function renderCart() {
        const cart = getCart();
        const container = document.getElementById("cartContainer");
        if (!cart.length) {
          container.innerHTML = `
      <div class="text-center py-5 bg-card rounded-4 p-4 border">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <h4 class="mt-3 fw-bold">Giỏ hàng của bạn đang trống</h4>
        <p class="text-muted">Khám phá hàng ngàn sản phẩm công nghệ chính hãng giá tốt tại TechZone!</p>
        <a href="products.html" class="btn btn-warning fw-bold px-4 py-2 mt-2"><i class="bi bi-arrow-left"></i> Tiếp tục mua sắm</a>
      </div>`;
          return;
        }
        const subtotal = getCartTotal();
        const coupon = localStorage.getItem("techzone-coupon");
        let discount = 0;
        if (coupon && COUPONS[coupon]?.type === "percent")
          discount = (subtotal * COUPONS[coupon].value) / 100;
        const ship = coupon === "FREESHIP" || subtotal >= 500000 ? 0 : 30000;
        const total = Math.max(0, subtotal - discount + ship);

        container.innerHTML = `
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
              <span class="fw-bold">Sản phẩm (${getCartCount()})</span>
              <button class="btn btn-sm btn-link text-danger text-decoration-none" onclick="if(confirm('Bạn có chắc muốn xóa tất cả sản phẩm?')){localStorage.removeItem('techzone-cart');updateCartBadge();renderCart();showToast('Đã dọn sạch giỏ hàng','info');}">
                <i class="bi bi-trash"></i> Xóa tất cả
              </button>
            </div>
            ${cart
              .map(
                (item) => `
              <div class="d-flex gap-3 border-bottom pb-3 mb-3 align-items-center flex-wrap flex-sm-nowrap">
                <img src="${item.image}" class="cart-img rounded-3" alt="${item.name}" onerror="handleImgError(this, 'phone', '${item.name.replace(/'/g, "\\'")}')">
                <div class="flex-grow-1 min-w-0">
                  <h6 class="mb-1 fw-bold text-truncate">${item.name}</h6>
                  <div class="text-muted small mb-1">Phiên bản: <span class="badge bg-secondary bg-opacity-25 text-dark">${item.variant}</span></div>
                  <div class="text-danger fw-bold">${formatPrice(item.price)}</div>
                </div>
                <div class="d-flex align-items-center gap-3 ms-auto">
                  <div class="input-group input-group-sm" style="width:110px">
                    <button class="btn btn-outline-secondary" onclick="cartUpdate(${item.id},'${item.variant}',${item.qty - 1})">-</button>
                    <input type="text" class="form-control text-center" value="${item.qty}" readonly>
                    <button class="btn btn-outline-secondary" onclick="cartUpdate(${item.id},'${item.variant}',${item.qty + 1})">+</button>
                  </div>
                  <button class="btn btn-sm btn-link text-danger p-0" onclick="cartRemove(${item.id},'${item.variant}')" title="Xóa">
                    <i class="bi bi-trash fs-5"></i>
                  </button>
                </div>
              </div>`,
              )
              .join("")}
            <div class="d-flex justify-content-between pt-2">
              <a href="products.html" class="btn btn-outline-dark btn-sm fw-bold">← Tiếp tục mua hàng</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top: 90px;">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3 border-bottom pb-2">Tóm tắt đơn hàng</h5>
            <div class="d-flex justify-content-between mb-2"><span>Tạm tính</span><span>${formatPrice(subtotal)}</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Giảm giá voucher</span><span class="text-success">-${formatPrice(discount)}</span></div>
            <div class="d-flex justify-content-between mb-2">
              <span>Phí vận chuyển</span>
              <span>${ship === 0 ? '<span class="text-success fw-bold">Miễn phí</span>' : formatPrice(ship)}</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3 align-items-baseline">
              <strong>Tổng thanh toán</strong>
              <strong class="text-danger fs-4">${formatPrice(total)}</strong>
            </div>

            <div class="mb-3">
              <label class="small fw-semibold mb-1">Mã giảm giá</label>
              <div class="input-group">
                <input type="text" id="couponInput" class="form-control" placeholder="Nhập mã..." value="${coupon || ""}">
                <button class="btn btn-warning fw-bold" onclick="applyCouponAction()">Áp dụng</button>
              </div>
              <div class="d-flex gap-1 mt-2 flex-wrap">
                <button class="badge border bg-light text-dark p-1" onclick="document.getElementById('couponInput').value='TECH10';applyCouponAction()">TECH10 (-10%)</button>
                <button class="badge border bg-light text-dark p-1" onclick="document.getElementById('couponInput').value='TECH20';applyCouponAction()">TECH20 (-20%)</button>
                <button class="badge border bg-light text-dark p-1" onclick="document.getElementById('couponInput').value='FREESHIP';applyCouponAction()">FREESHIP</button>
              </div>
            </div>

            <a href="checkout.html" class="btn btn-warning w-100 fw-bold btn-lg shadow-sm">
              Tiến hành thanh toán <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>
    </div>`;
      }

      function cartUpdate(id, variant, qty) {
        updateQty(id, variant, qty);
        renderCart();
      }
      function cartRemove(id, variant) {
        removeFromCart(id, variant);
        renderCart();
        showToast("Đã xóa sản phẩm", "info");
      }
      function applyCouponAction() {
        const code = document.getElementById("couponInput").value.trim();
        const r = applyCoupon(code);
        showToast(r.message, r.success ? "success" : "error");
        if (r.success) renderCart();
      }

      document.addEventListener("DOMContentLoaded", renderCart);
    </script>
  </body>
</html>
