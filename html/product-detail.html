<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body>
    <div class="top-bar">
      <div class="container d-flex justify-content-between flex-wrap gap-2">
        <div class="d-none d-md-flex gap-4">
          <span><i class="bi bi-telephone-fill"></i> Hotline: 1900 1234</span>
          <span><i class="bi bi-truck"></i> Freeship đơn 500K</span>
          <span><i class="bi bi-arrow-repeat"></i> Đổi trả 30 ngày</span>
        </div>
        <div><i class="bi bi-tag-fill"></i> Hàng chính hãng 100% nguyên seal</div>
      </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="../index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-3">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Trang chủ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="products.html">Sản phẩm</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="brands.html">Thương hiệu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="blog.html">Tin công nghệ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Liên hệ</a>
            </li>
          </ul>
          <div class="search-wrap me-3">
            <i class="bi bi-search"></i>
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Tìm sản phẩm, thương hiệu..."
            />
            <div id="searchSuggestions"></div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="wishlist.html" class="badge-icon" title="Yêu thích">
              <i class="bi bi-heart"></i><span class="badge wishlist-badge">0</span>
            </a>
            <a href="compare.html" class="badge-icon" title="So sánh">
              <i class="bi bi-arrow-left-right"></i><span class="badge compare-badge">0</span>
            </a>
            <a href="cart.html" class="badge-icon" title="Giỏ hàng">
              <i class="bi bi-cart3"></i><span class="badge cart-badge">0</span>
            </a>
            <button
              class="btn btn-sm btn-outline-secondary theme-toggle"
              onclick="toggleTheme()"
            >
              <i class="bi bi-moon-fill"></i>
            </button>
            <div id="auth-area"></div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container my-4" id="productDetail"></div>

    <footer>
      <div class="container text-center small py-4 text-muted">
        &copy; 2024 TechZone. All rights reserved.
      </div>
    </footer>
    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/product-detail.js"></script>
  </body>
</html>
