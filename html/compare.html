<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>So sánh sản phẩm | TechZone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dark-mode.css" rel="stylesheet" />
    <link href="../css/responsive.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-techzone">
      <div class="container">
        <a class="navbar-brand" href="../index.html"
          ><i class="bi bi-cpu"></i> Tech<span>Zone</span></a
        >
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="products.html" class="nav-link d-none d-md-inline-block">Sản phẩm</a>
          <a href="cart.html" class="badge-icon" title="Giỏ hàng">
            <i class="bi bi-cart3"></i><span class="badge cart-badge">0</span>
          </a>
          <button
            class="btn btn-sm btn-outline-secondary theme-toggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
          <div id="auth-area"></div>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="../index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">So sánh sản phẩm</li>
        </ol>
      </nav>
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold mb-0">
          <i class="bi bi-arrow-left-right text-warning"></i> So sánh thông số chi tiết
        </h2>
        <a href="products.html" class="btn btn-outline-warning btn-sm fw-bold">+ Thêm sản phẩm khác</a>
      </div>
      <div id="compareContainer"></div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="container text-center small py-4 text-muted">
        &copy; 2024 TechZone. All rights reserved.
      </div>
    </footer>

    <button id="backTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function renderCompare() {
        const ids = getCompare();
        const el = document.getElementById("compareContainer");
        if (!ids.length) {
          el.innerHTML = `
            <div class="text-center py-5 bg-card rounded-4 p-4 border">
              <i class="bi bi-arrow-left-right display-1 text-muted"></i>
              <h4 class="mt-3 fw-bold">Chưa có sản phẩm nào trong danh sách so sánh</h4>
              <p class="text-muted">Chọn tối đa 4 sản phẩm cùng loại để so sánh thông số cấu hình và giá bán!</p>
              <a href="products.html" class="btn btn-warning fw-bold px-4 py-2 mt-2">Chọn sản phẩm so sánh ngay</a>
            </div>`;
          return;
        }
        const items = ids.map(getProductById).filter(Boolean);
        el.innerHTML = `
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="min-width:140px;" class="fw-bold">Tiêu chí</th>
              ${items
                .map(
                  (p) => `
                <th class="text-center p-3" style="min-width:220px;">
                  <div class="position-relative">
                    <img src="${p.images[0]}" width="110" height="110" class="rounded object-fit-contain p-2 bg-light mb-2" alt="${p.name}" onerror="handleImgError(this, '${p.category}', '${p.name.replace(/'/g, "\\'")}')">
                    <button class="btn btn-sm btn-light border position-absolute top-0 end-0 text-danger" onclick="toggleCompare(${p.id});renderCompare()" title="Xóa khỏi so sánh">
                      <i class="bi bi-x-lg"></i>
                    </button>
                  </div>
                  <a href="product-detail.html?id=${p.id}" class="text-decoration-none text-dark fw-bold d-block small mb-1">${p.name}</a>
                  <span class="badge bg-warning text-dark">${getBrandName(p.brand)}</span>
                </th>`,
                )
                .join("")}
            </tr>
          </thead>
          <tbody>
            <tr><th class="fw-bold">Giá bán</th>${items.map((p) => `<td class="text-center text-danger fw-bold fs-5">${formatPrice(p.price)}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Thương hiệu</th>${items.map((p) => `<td class="text-center">${getBrandName(p.brand)}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Màn hình</th>${items.map((p) => `<td class="text-center small">${p.specs?.screen || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Vi xử lý (CPU)</th>${items.map((p) => `<td class="text-center small fw-semibold">${p.specs?.cpu || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">RAM</th>${items.map((p) => `<td class="text-center">${p.specs?.ram || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Bộ nhớ trong</th>${items.map((p) => `<td class="text-center">${p.specs?.storage || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Camera</th>${items.map((p) => `<td class="text-center small">${p.specs?.camera || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Dung lượng Pin</th>${items.map((p) => `<td class="text-center">${p.specs?.battery || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Hệ điều hành</th>${items.map((p) => `<td class="text-center">${p.specs?.os || "—"}</td>`).join("")}</tr>
            <tr><th class="fw-bold">Đánh giá</th>${items.map((p) => `<td class="text-center text-warning">${"★".repeat(p.rating)}${"☆".repeat(5 - p.rating)} <span class="text-muted small">(${p.reviews})</span></td>`).join("")}</tr>
            <tr>
              <th></th>
              ${items
                .map(
                  (p) => `
                <td class="text-center p-3">
                  <button class="btn btn-warning btn-sm w-100 fw-bold py-2" onclick="addToCart(${p.id})">
                    <i class="bi bi-cart-plus"></i> Thêm giỏ
                  </button>
                </td>`,
                )
                .join("")}
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
      }
      document.addEventListener("DOMContentLoaded", renderCompare);
    </script>
  </body>
</html>
